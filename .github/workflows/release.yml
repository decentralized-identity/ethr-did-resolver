name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
      - name: 'Setup Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Verify the whole workspace before any release work happens, mirroring the
      # pre-changesets release pipeline (these also run on every PR via test.yml).
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:ci

      - name: 'Create release PR or publish packages'
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          github-token: ${{ github.token }}
          publish-script: 'pnpm run release:publish'
