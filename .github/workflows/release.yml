name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.20.0
      - name: 'Setup Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Creates/updates the "chore(release): version packages" PR when changesets
      # are present, or publishes the newly versioned packages on merge.
      - name: 'Create release PR or publish packages'
        id: changesets
        uses: changesets/action@v2
        with:
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          publish: 'pnpm run release:publish'
        env:
          # Needs a token with "contents: write" to create the release PR and tag commits
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # npm publish token (via pnpm). If the package has trusted publishing
          # configured, this can be replaced with pnpm publish --publish-tag --no-git-checks
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}