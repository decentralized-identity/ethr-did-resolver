name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.26.0
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: 'Setup Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Verify the whole workspace before any release work happens, mirroring the
      # pre-changesets release pipeline (these also run on every PR via test.yml).
      - run: pnpm run format
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:ci

      - name: 'Create release PR or publish packages'
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          github-token: ${{ github.token }}
          publish-script: 'pnpm run release:publish'
